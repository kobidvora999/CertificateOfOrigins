properties:
  is signing: true          # TODO(confirm with developer): an official EUR1 certificate is digitally signed → true
  is tagging: false
  print format: Pdf
fields:
 - tag: CertificateID
   field type: PlainText
   field path: $.certificateID
 - tag: ExporterName
   field type: PlainText
   field path: $.exporterName
 - tag: ExporterAddress
   field type: PlainText
   field path: $.exporterAddress
 - tag: ConsigneeName
   field type: PlainText
   field path: $.consigneeName
 - tag: ConsigneeAddress
   field type: PlainText
   field path: $.consigneeAddress
 - tag: CustomsHouse
   field type: PlainText
   field path: $.customsHouse
 - tag: DestinationCountryORGroupOfCountries
   field type: PlainText
   field path: $.destinationCountryORGroupOfCountries
 - tag: TradeAgreementCountryORGroupOfCountries
   field type: PlainText
   field path: $.tradeAgreementCountryORGroupOfCountries
 - tag: Transport
   field type: PlainText
   field path: $.transport
 - tag: Observations
   field type: PlainText
   field path: $.observations
 - tag: RequestReasonObservations
   field type: PlainText
   field path: $.requestReasonObservations
 - tag: PlaceOfManufacture
   field type: PlainText
   field path: $.placeOfManufacture
 - tag: ZipCodeOfManufacture
   field type: PlainText
   field path: $.zipCodeOfManufacture
 - tag: DeclarationPlaceAndDate
   field type: PlainText
   field path: $.declarationPlaceAndDate
 - tag: IssuingDate
   field type: PlainText
   field path: $.issuingDate
   value type: DateTime
   value format: dd/MM/yyyy
 - tag: IsDraft
   field type: PlainText
   field path: $.isDraft            # legacy draft/final label ("טיוטה"/"סופי")
 - tag: QRCode
   field type: Barcode              # QR image (verified <w:drawing>); TODO(confirm): Barcode vs Image
   field path: $.qRCode
 - tag: SiteStamp
   field type: Image
   field path: $.siteStamp
 - tag: UserSignature
   field type: Image
   field path: $.userSignature
 # Goods-item repeating table. Requires the fixed .docx (CertificateOfOriginEUR1.docx) where the REGEON_tbl1
 # content control wraps the whole <w:tbl> (see the pilot fix), so TemplateBL.MergeTableField accepts it.
 - tag: REGEON_tbl1
   field type: Table
   field path: $.goodsItems
   cells:
    - tag: MarksAndNumbers
      field type: PlainText
      field path: marksAndNumbers
    - tag: Quantity
      field type: PlainText
      field path: quantity
    - tag: PackingType
      field type: PlainText
      field path: packingType
    - tag: GoodsDescription
      field type: PlainText
      field path: goodsDescription
    - tag: GrossWeightAndMeasureType
      field type: PlainText
      field path: grossWeightAndMeasureType
    - tag: InvoiceNumber
      field type: PlainText
      field path: invoiceNumber
