$kind: http-request
url: "{{base_URL}}/api/CertificateOfOrigins/Template/1/{{fileId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('content type is pdf', () => pm.expect(pm.response.headers.get('Content-Type') || '').to.include('pdf'));
    language: text/javascript
order: 3000
