$kind: http-request
url: "{{base_URL}}/api/CertificateOfOrigins/SaveAttachments"
method: POST
headers:
  Content-Type: "application/json"
body:
  type: json
  content: |-
    { "certificatesTemplates": [ { "id": 1, "name": "certificate", "content": "dGVzdA==", "documentTypeId": 329, "isPdfFormat": true } ], "certificateNumber": "{{certNumber}}", "certificateId": {{certId}}, "certificateRequestReasonCode": 1, "certificateTypeId": 1 }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 4100
