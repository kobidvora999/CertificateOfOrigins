$kind: http-request
url: "{{base_URL}}/ui/AuthenticationRequest/HandleImportDeliveryForImporterSent"
method: POST
headers:
  Content-Type: "application/json"
body:
  type: json
  content: |-
    {
      "documentId": {{docA}},
      "organizationUnitId": 1,
      "authenticationFileId": {{fileId}},
      "authenticationFileStatusId": {{fileStatus}},
      "deliveryMethodId": {{fileDm}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      try {
        const j = pm.response.json();
        if (j && j.decisionId !== undefined && j.decisionId !== null) pm.collectionVariables.set('decA', j.decisionId);
      } catch (e) { console.error('capture failed', e); }
    language: text/javascript
order: 4500
