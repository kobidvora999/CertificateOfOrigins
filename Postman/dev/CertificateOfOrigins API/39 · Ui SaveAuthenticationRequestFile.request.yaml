$kind: http-request
url: "{{base_URL}}/ui/AuthenticationRequest/SaveFile"
method: POST
headers:
  Content-Type: "application/json"
body:
  type: json
  content: |-
    {
      "id": {{fileId}},
      "authenticationFileStatusId": 5,
      "originalAuthenticationFileStatusId": {{fileStatus}},
      "notes": null, "postalAdress": "flow address", "deliveryMethodId": 1,
      "emailAdress": "flow@example.com", "reminderMethodId": 1, "requestCountryId": 32,
      "userId": 5, "userNameIssuingLetter": "flow user",
      "lastDelivery": null, "importerContactingReasonId": null, "firstProvideContactDate": null,
      "organizationUnitId": 1,
      "requests": [
        { "documentId": {{docA}}, "authenticationFileId": {{fileId}}, "decisionId": 3, "originalRequestDecisionId": {{decA}},
          "documentIssuingDate": "{{today}}", "organizationUnitId": 1, "userId": 5, "userResponseId": 5 }]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 4800
