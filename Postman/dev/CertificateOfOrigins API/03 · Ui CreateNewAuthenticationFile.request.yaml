$kind: http-request
url: "{{base_URL}}/ui/AuthenticationRequest/File"
method: POST
headers:
  Content-Type: "application/json"
body:
  type: json
  content: |-
    [
      {
        "documentId": {{docA}},
        "organizationUnitIdNum": 1,
        "issuingCountryIdNum": 32,
        "customerId": 888,
        "responseNameEmail": "flow@example.com"
      }
    ]
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      try {
        const j = pm.response.json();
        if (j && j.id !== undefined && j.id !== null) pm.collectionVariables.set('fileId', j.id);
        if (j && j.organizationUnitId !== undefined && j.organizationUnitId !== null) pm.collectionVariables.set('fileOrg', j.organizationUnitId);
        if (j && j.authenticationFileStatusId !== undefined && j.authenticationFileStatusId !== null) pm.collectionVariables.set('fileStatus', j.authenticationFileStatusId);
        if (j && j.deliveryMethodId !== undefined && j.deliveryMethodId !== null) pm.collectionVariables.set('fileDm', j.deliveryMethodId);
      } catch (e) { console.error('capture failed', e); }
    language: text/javascript
order: 1200
