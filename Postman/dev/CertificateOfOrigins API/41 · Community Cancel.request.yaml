$kind: http-request
url: "{{base_URL}}/community/CertificateOfOrigins/{{replacementNumber}}"
method: DELETE
headers:
  MessageSenderId: "{{messageSenderId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000
