$kind: http-request
url: "{{base_URL}}/ui/AuthenticationRequest/ByFilter"
method: QUERY
headers:
  Content-Type: "application/json"
body:
  type: json
  content: |-
    {
      "documentId": {{docA}},
      "fromRequestDate": "{{tenDaysAgo}}",
      "toRequestDate": "{{inOneMonth}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 2500
