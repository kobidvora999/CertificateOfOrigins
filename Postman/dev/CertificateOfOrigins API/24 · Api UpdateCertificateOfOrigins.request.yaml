$kind: http-request
url: "{{base_URL}}/api/CertificateOfOrigins/Reconcile"
method: POST
headers:
  Content-Type: "application/json"
body:
  type: json
  content: |-
    {
      "eventType": 240,
      "leadDocumentId": 111,
      "exportDeclarationNum": "260146",
      "certificateOfOriginsIds": [ {{certId}} ],
      "exporterCustomerId": 777,
      "destinationCountryId": 138,
      "organizationUnitId": 407,
      "exportInvoiceInfoList": [ { "externalIdNum": "INV1", "exportGoodsItemInfoList": [] } ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 3300
