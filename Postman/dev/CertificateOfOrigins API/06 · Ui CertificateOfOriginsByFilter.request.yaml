$kind: http-request
url: "{{base_URL}}/ui/certificate-of-origins"
method: QUERY
headers:
  Content-Type: "application/json"
body:
  type: json
  content: |-
    { "certificateNumber": "{{certNumber}}" }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 1500
