$kind: http-request
url: "{{base_URL}}/api/certificate-of-origins/convert"
method: POST
headers:
  Content-Type: "application/json"
body:
  type: json
  content: |-
    { "entityIdKey1": "{{certNumber}}" }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 1600
