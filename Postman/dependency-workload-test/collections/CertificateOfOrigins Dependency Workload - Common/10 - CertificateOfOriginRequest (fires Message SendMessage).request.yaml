$kind: http-request
url: "{{base_URL}}/CertificateOfOrigins/CertificateOfOriginRequest"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "customerId": 1,
      "agentRequest": {
        "requestReasonCode": 1,
        "certificateOfOriginTypeCode": 3,
        "exportDeclarationNum": "260146"
      },
      "certificateOfOrigin": {
        "exporterId": "EXP1",
        "exporterName": "Acme",
        "exporterAddress": "1 Main St",
        "exporterCountry": "IL",
        "consigneeName": "Buyer",
        "consigneeAddress": "2 St",
        "consigneeCountry": "DE",
        "originCountry": "IL",
        "destinationCountry": "DE",
        "customsHouse": "SITE01",
        "dateOfDeclaration": "2026-08-12T00:00:00",
        "isDeclaredByManufacturer": true,
        "isDeclaredByExporter": true,
        "invoiceDetails": [
          {
            "invoiceNum": "INV1",
            "invoiceDate": "2026-08-01T00:00:00",
            "descriptionOfInvoice": "goods",
            "itemDetails": [
              { "itemId": "123456", "marksAndNumbers": "M1", "itemDescription": "widget", "originCriterion": "A", "measureType": "KG", "packageType": "BX" }
            ]
          }
        ]
      }
    }
scripts:
  - type: afterResponse
    code: |-
      // Liveness: Common answered — the request feedback is sent via Message/SendMessage after the certificate saves.
      pm.test("Common alive — HTTP 200", () => pm.expect(pm.response.code).to.equal(200));
    language: text/javascript
order: 1000
