$kind: http-request
url: "{{base_URL}}/CertificateOfOrigins/LoadDataFromExportDeclaration"
method: QUERY
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "leadDocumentId": {{leadDocumentId}},
      "requestReasonCode": 1
    }
scripts:
  - type: afterResponse
    code: |-
      // Liveness: ExportDealFile answered — LoadDataFromExportDeclaration looks up the declaration in ExportDealFile.
      pm.test("ExportDealFile alive — HTTP 200", () => pm.expect(pm.response.code).to.equal(200));
    language: text/javascript
order: 1000
