$kind: collection
name: CertificateOfOrigins Dependency Workload - Customers
description: Dependency probe — proves the Customers microservice is alive (Customer/CustomersByIds, and CustomerByExternalId during message validation). GET CertificateOfOriginById enriches the certificate's customer name via Customers. Runs PRE-PROD with REAL proxies.
variables:
  base_URL: http://localhost:9034
scripts:
  - type: http:beforeRequest
    code: |-
      pm.request.headers.upsert({ key: 'CC-USER-ID', value: '5' });
    language: text/javascript
