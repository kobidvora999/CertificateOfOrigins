$kind: collection
name: CertificateOfOrigins Dependency Workload - Users
description: Dependency probe — proves the Users microservice is alive (User/UsersByIds). GET CertificateOfOriginById enriches the acting/handling user name via Users. Runs PRE-PROD with REAL proxies.
variables:
  base_URL: http://localhost:9034
scripts:
  - type: http:beforeRequest
    code: |-
      pm.request.headers.upsert({ key: 'CC-USER-ID', value: '5' });
    language: text/javascript
