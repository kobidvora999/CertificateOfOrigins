$kind: http-request
url: "{{baseUrl}}/CertificateOfOrigins"
method: POST
headers:
  Content-Type: application/json
# Saves a certificate as Published (status 8). That is the ONLY path that stamps CertificateOfOrigin.Guid:
# CreateQrCodeIfNeeded stamps it only when QrCodePath is empty AND the status is Published
# (CertificateOfOriginsBl.cs:1044). Without a Guid the whole web-query mapping loop is unreachable, which is
# why MapConsigneeField / MapDateOfDeclarationField / MapDetailField / PrintOutField all sat at 0%.
body:
  type: json
  content: |-
    {
      "id": 0,
      "typeId": 2,
      "title": "בקשת תעודת מקור",
      "state": 1,
      "organizationUnitId": 1,
      "customerId": 777,
      "createCustomerId": 777,
      "certificateNumber": "POSTMAN-COO-1",
      "certificateOfOriginStatusId": 8,
      "originalCertificateOfOriginStatusId": 0,
      "requestReasonCode": 1,
      "isLastVersion": true,
      "versionNumber": 1,
      "certificateOfOriginDetails": [
        {
          "certificateDetailsTypeCodeId": 2,
          "value": "יצואן לדוגמה"
        },
        {
          "certificateDetailsTypeCodeId": 13,
          "value": "32"
        }
      ]
    }
order: 10000
