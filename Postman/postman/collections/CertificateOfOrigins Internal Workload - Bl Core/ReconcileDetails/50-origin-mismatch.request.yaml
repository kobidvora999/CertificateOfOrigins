$kind: http-request
url: "{{baseUrl}}/api/CertificateOfOrigins/Reconcile"
method: POST
headers:
  Content-Type: application/json
# No declaration goods item carries the certificate's origin country -> ValidateCertificateGoodsItem's OriginCountryMismatch, the first of the two arms that share that message.
body:
  type: json
  content: |-
    {
      "eventType": 240, "leadDocumentId": 111,
      "exportDeclarationNum": "260146",
      "certificateOfOriginsIds": [ {{certId}} ],
      "exporterCustomerId": 888,
      "destinationCountryId": 32,
      "organizationUnitId": 1,
      "exportInvoiceInfoList": [ { "externalIdNum": "INV1", "exportGoodsItemInfoList": [
          { "certificateOfOriginId": {{certId}}, "customsItemId": 111111, "originCountryId": 99 }] } ]
    }
order: 22050
