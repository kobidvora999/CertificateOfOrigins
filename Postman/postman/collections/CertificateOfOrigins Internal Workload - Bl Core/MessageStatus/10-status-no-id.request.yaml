$kind: http-request
url: "{{baseUrl}}/community/certificate-of-origins"
method: POST
headers:
  MessageSenderId: "1"
  Content-Type: application/json
# Was: reason 13 (GetRequestStatus) with NO certificateId -> MustSendCertificateID(14026318), in-band under 200. Pure REST: the status query is
# GET {certificateId}, so a query without a number cannot be sent any more. Closest case kept: reason 13 sent to POST create, which accepts only
# 1, 2, 10, 12 -> 400 with errors[].field AgentRequest.RequestReasonCode.
body:
  type: json
  content: |-
    { "agentRequest": { "internalApplication": "internal-workload", "requestReasonCode": 13, "certificateOfOriginTypeCode": 1 } }
order: 21000
