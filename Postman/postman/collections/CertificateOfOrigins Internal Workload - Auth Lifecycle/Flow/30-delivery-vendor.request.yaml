$kind: http-request
url: "{{baseUrl}}/ui/authentication-request/handle-import-delivery-and-reminder-for-vendor-sent"
method: POST
headers:
  Content-Type: application/json
# Delivery to the vendor - advances the flow-created file's status machine (AdvanceDeliveryStatus). isDelivery=true is the delivery branch.
body:
  type: json
  content: |-
    {
      "id": {{fileId}},
      "authenticationFileStatusId": {{fileStatus}},
      "deliveryMethodId": {{fileDm}},
      "isDelivery": true
    }
order: 13000
