$kind: http-request
url: "{{baseUrl}}/ui/AuthenticationRequest/HandleImportDeliveryAndReminderForVendorSent"
method: POST
headers:
  Content-Type: application/json
# Same endpoint with isDelivery=false - the REMINDER branch of AdvanceDeliveryStatus - sent from the state the delivery at 30 returned.
body:
  type: json
  content: |-
    {
      "id": {{fileId}},
      "authenticationFileStatusId": {{fileStatus}},
      "deliveryMethodId": {{fileDm}},
      "isDelivery": false
    }
order: 14000
