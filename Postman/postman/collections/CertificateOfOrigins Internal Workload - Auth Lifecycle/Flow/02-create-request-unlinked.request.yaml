$kind: http-request
url: "{{baseUrl}}/ui/AuthenticationRequest/SaveImport"
method: POST
headers:
  Content-Type: application/json
# FLOW STEP - a request that never joins a file (the AuthenticationFileID IS NULL branch read by 10-request-unlinked).
# isNewInstance = true INSERTS the request (the legacy "new request" popup path). DocumentID is caller-assigned and
# minted per run in the collection pre-request script, so no fixed id and no seed is involved. Decision 1 with
# isCurrentUserHandleRequest = true takes the quiet arm of the switch: no event, no message.
body:
  type: json
  content: |-
    {
      "documentId": {{docUnlinked}},
      "isNewInstance": true,
      "authenticationFileId": null,
      "authenticationRequestDate": "{{today}}",
      "collateralId": null,
      "decisionId": 1,
      "leadDocumentId": {{docUnlinked}},
      "documentIssuingDate": "{{today}}",
      "importCountryId": 32,
      "issuingCountryId": 32,
      "number": 1,
      "originCountryId": 32,
      "preferenceDocumentTypeId": 1,
      "responseNameEmail": "flow@example.com",
      "responsePhoneNum": "0500000000",
      "organizationUnitId": 1,
      "vendorId": 778,
      "vendorName": "Flow Vendor 2",
      "customerId": null,
      "importerId": null,
      "remarks": "flow unlinked request",
      "userId": 5,
      "userResponseId": 5,
      "isCurrentUserHandleRequest": true,
      "collaterals": []
    }
order: 1100
