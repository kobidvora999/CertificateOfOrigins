$kind: http-request
url: "{{baseUrl}}/community/CertificateOfOrigins"
method: POST
headers:
  MessageSenderId: "1"
  Content-Type: application/json
# CheckContainerIsoCode fires only when the RESOLVED PackingTypeId equals 379. The mock derives the id from the code as (sum of chars %% 1000) + 1, and "BOX-40" sums to 378 -> 379, so this is the one code that reaches the container branch. No containerIsoCode -> 14026376.
# NOT CONVERTED FAITHFULLY: the contract caps packageType at 5 characters, so "BOX-40" is refused by the contract (400, before the BL) and CheckContainerIsoCode is not reached. A packing code of at most 5 characters that resolves to PackingTypeContainer is needed; until then this asserts the contract 400.
body:
  type: json
  content: |-
    {
            "agentRequest": { "internalApplication": "internal-workload", "requestReasonCode": 1, "certificateOfOriginTypeCode": 1, "exportDeclarationNum": "260146" },
      "certificateOfOrigin": {
        "exporterId": "EXP1", "exporterName": "Acme", "exporterAddress": "1 Main St", "exporterCountry": "IL",
        "tradeAgreementCountry1": "IL", "tradeAgreementCountry2": "DE",
        "isCumulation": true, "cumulationCountry": "DE",
        "originCountry": "IL", "destinationCountry": "DE",
        "placeOfManufacture": 1, "zipCodeOfManufacture": 6100000,
        "consigneeName": "Buyer", "consigneeAddress": "2 St", "consigneeCountry": "DE",
        "customsHouse": "SIT01", "issuingCountry": "IL", "cityOfDeclaration": 1, "countryOfDeclaration": "IL",
        "dateOfDeclaration": "{{twoDaysAgo}}",
        "invoiceDetail": [
        { "invoiceNum": "INV1", "invoiceDate": "{{tenDaysAgo}}", "descriptionOfInvoice": "goods",
          "itemDetail": [ { "itemId": "123456", "marksAndNumbers": "M1", "itemDescription": "widget", "originCriterion": "A", "measureType": "KG", "packageType": "BOX-40" } ] }]
      }
    }
order: 10400
