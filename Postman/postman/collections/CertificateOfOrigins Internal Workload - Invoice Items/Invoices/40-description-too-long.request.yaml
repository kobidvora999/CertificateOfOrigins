$kind: http-request
url: "{{baseUrl}}/community/certificate-of-origins"
method: POST
headers:
  MessageSenderId: "1"
  Content-Type: application/json
# A 256-character invoice description -> CheckDescriptionLength raises 14027343 (the BL cap is 255). The value is still kept - the legacy warns rather than truncates.
# 256 is the contract maximum: the old 300 characters are now refused by the contract before the BL runs.
body:
  type: json
  content: |-
    {
            "agentRequest": { "internalApplication": "internal-workload", "requestReasonCode": 1, "certificateOfOriginTypeCode": 1, "exportDeclarationNum": "260146" },
      "certificateOfOrigin": {
        "exporterId": "EXP1", "exporterName": "Acme", "exporterAddress": "1 Main St", "exporterCountry": "IL",
        "tradeAgreementCountry1": "IL", "tradeAgreementCountry2": "DE",
        "isCumulation": true, "cumulationCountry": "DE",
        "originCountry": "IL", "destinationCountry": "DE",
        "placeOfManufacture": 1, "zipCodeOfManufacture": 6100000,
        "consigneeName": "Buyer", "consigneeAddress": "2 St", "consigneeCountry": "DE",
        "customsHouse": "SIT01", "issuingCountry": "IL", "cityOfDeclaration": 1, "countryOfDeclaration": "IL",
        "dateOfDeclaration": "{{twoDaysAgo}}",
        "invoiceDetail": [
        { "invoiceNum": "INV1", "invoiceDate": "{{tenDaysAgo}}", "descriptionOfInvoice": "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx",
          "itemDetail": [ { "itemId": "123456", "marksAndNumbers": "M1", "itemDescription": "widget", "originCriterion": "A", "measureType": "KG", "packageType": "BX" } ] }]
      }
    }
order: 10300
