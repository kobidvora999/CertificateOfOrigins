$kind: http-request
url: "{{baseUrl}}/CertificateOfOrigins/Request"
method: POST
headers:
  Content-Type: application/json
# MERCOSUR (type 3), not EURMED. IsCustomsItemMandatory and IsCriterionMandatory are NOT request fields - the
# BL overwrites them server-side from the certificate type row (MessageValidation.cs:105-107), so the only way to
# turn them on is to pick a type where the C-table says True. Type 3 is the one type with BOTH
# (criterion=True, customsItem=True); EURMED has neither, which is why these arms had never run.
# No originCriterion on a type that mandates one -> OriginCriteriaMissing(5013).
body:
  type: json
  content: |-
    {
      "customerId": 1,
      "agentRequest": { "requestReasonCode": 1, "certificateOfOriginTypeCode": 3, "exportDeclarationNum": "260146" },
      "certificateOfOrigin": {
        "exporterId": "EXP1", "exporterName": "Acme", "exporterAddress": "1 Main St", "exporterCountry": "IL",
        "consigneeName": "Buyer", "consigneeAddress": "2 St", "consigneeCountry": "DE",
        "originCountry": "IL", "destinationCountry": "DE",
        "customsHouse": "SITE01", "dateOfDeclaration": "{{twoDaysAgo}}",
        "isDeclaredByManufacturer": true, "isDeclaredByExporter": true,
        "invoiceDetails": [
          { "invoiceNum": "INV1", "invoiceDate": "{{tenDaysAgo}}", "descriptionOfInvoice": "goods",
            "itemDetails": [ { "itemId": "123456", "marksAndNumbers": "M1", "itemDescription": "widget", "measureType": "KG", "packageType": "BX" } ] }
        ]
      }
    }
order: 10700
