$kind: collection
id: certificateoforigins-invoice-items-v1
name: CertificateOfOrigins Invoice Items
description: >-
  The invoice / item half of the message engine (CertificateOfOriginsBl.MessageInvoice.cs) — the shape
  validation and the per-item code resolution. It sat at 77.6% line / 67.6% branch for one reason: every
  fixture in the repo sent exactly ONE well-formed invoice carrying exactly ONE well-formed item, so each
  guard was only ever taken down its success side. `ValidateInvoiceShape` was 51.6%, and the two resolvers
  that may legitimately receive no code at all had never received one.
  Each request here malforms exactly ONE thing about that invoice and asserts the legacy code it must raise —
  and the two scenarios where the correct answer is "nothing happens" (an omitted packing/measure code, an
  ancient invoice date that is silently clamped) assert exactly that, because a validator that fired on those
  too would otherwise look just as green.
  Every scenario is a POST community/certificate-of-origins create with no certificate number, so none of them takes
  the five-minute message lock; this collection is freely re-runnable. Pure REST: a rejected message is HTTP 400
  with the legacy code in errors[].errorCode (string) and its text in errors[].detail, not 200 with an in-band
  exceptions[] array.
variables:
  baseUrl: http://localhost:9034
scripts:
  - type: http:beforeRequest
    code: |-
      pm.request.headers.upsert({ key: 'x-mock-mode', value: 'x-mock-mode' });
      pm.request.headers.upsert({ key: 'CC-USER-ID', value: '5' });
      var iso = function (d) { return new Date(d).toISOString().slice(0, 10) + 'T00:00:00'; };
      var now = Date.now(), DAY = 86400000;
      pm.collectionVariables.set('twoDaysAgo', iso(now - 2 * DAY));
      pm.collectionVariables.set('tenDaysAgo', iso(now - 10 * DAY));
      pm.collectionVariables.set('tenYearsAgo', iso(now - 3650 * DAY));
    language: text/javascript
  - type: http:afterResponse
    code: |-
      var name = pm.info.requestName;
      var j = null; try { j = pm.response.json(); } catch (e) { j = null; }

      pm.test('no server error (5xx)', function () {
          pm.expect(pm.response.code, 'HTTP ' + pm.response.code).to.be.below(500);
      });
      // Pure REST (alternative 2, POST community/certificate-of-origins): a rejected message is 400 ProblemDetails whose
      // errors[] carry errorCode = the legacy exceptionType as a STRING and detail[0] = the legacy exceptionDescription;
      // a saved certificate is 201 with only its reconciliation warnings in exception[]. Both are read, codes as strings.
      var errList = (j && j.errors) ? j.errors : [];
      var exList  = (j && j.exception) ? j.exception : [];
      var codes  = errList.map(function (e) { return String(e.errorCode); })
          .concat(exList.map(function (e) { return String(e.exceptionType); }));
      var descr  = errList.map(function (e) { return (e.detail || []).join(' '); })
          .concat(exList.map(function (e) { return e.exceptionDescription || ''; })).join(' | ');

      var MUST = {
          '10-no-invoices':          [2387],       // ValidateInvoiceShape, no invoices
          '20-invoice-no-items':     [2387],       // ValidateInvoiceShape, no items
          '30-item-no-marks':        [2387],       // ValidateInvoiceShape, missing MarksAndNumbers
          '40-description-too-long': [14027343],   // CheckDescriptionLength
          '50-container-no-iso':     [14026376],   // CheckContainerIsoCode
          '60-customs-item-required':[14027172],   // CheckAndGetCustomsItem, mandatory + absent
          '70-customs-item-short':   [14027169],   // CheckAndGetCustomsItem, under six digits
          '80-criterion-missing':    [5013],       // CheckAndGetOriginCriterion, absent
          '90-criterion-illegal':    [5014]        // CheckAndGetOriginCriterion, unresolvable
      };
      // MandatoryValue(2387) is raised by three different guards here and by other validators elsewhere, so the
      // code alone would not say which one fired. The message carries the field name; assert that too.
      var MUST_SAY = {
          '10-no-invoices':      'CertificateOfOriginRequestInvoiceDetail',  // the legacy parameter text (CN-02)
          '20-invoice-no-items': 'CertificateOfOriginRequestItemDetail',
          '30-item-no-marks':    'MarksAndNumbers'
      };
      // The two "correct answer is silence" cases.
      var MUST_NOT = {
          // An omitted packing code is legal - only an UNRESOLVABLE one is an error - so the shared
          // TheValueInFieldNotExistsInSystem(650) must not appear. (measureType is now required by the contract, so
          // only the packing code is omitted.)
          '100-no-packing-no-measure': [650],
          // An invoice older than five years is floor-clamped, not rejected. If this ever starts raising
          // something, the clamp has turned into a validation and that is a behaviour change.
          '110-invoice-date-ancient':  [650, 2387, 14027343]
      };

      // NOT CONVERTED FAITHFULLY: the contract caps packageType at 5 characters, so "BOX-40" (the code that resolves to
      // the container packing type) is refused by the contract (400) before CheckContainerIsoCode runs - see the request
      // comment. Until a <=5-character container code exists, the contract-level 400 is what this request asserts.
      if (name === '50-container-no-iso') {
          pm.test(name + ': refused by the contract (packageType maxLength 5) - 400', function () {
              pm.response.to.have.status(400);
          });
          return;
      }

      // A scenario that must raise a validation code is a rejected message: 400 (was 200 with the code in-band). The two
      // silent scenarios asserted nothing about the outcome beyond 'answered', so either REST answer is accepted there.
      if (MUST[name]) {
          pm.test(name + ': rejected with 400', function () { pm.response.to.have.status(400); });
          MUST[name].forEach(function (c) {
              pm.test(name + ': errors[] carries errorCode ' + c, function () {
                  pm.expect(codes, 'codes seen: ' + JSON.stringify(codes)).to.include(String(c));
              });
          });
      }
      if (MUST_SAY[name]) {
          pm.test(name + ': the 2387 names ' + MUST_SAY[name], function () {
              pm.expect(descr).to.include(MUST_SAY[name]);
          });
      }
      if (MUST_NOT[name]) {
          pm.test(name + ': answered 201 or 400', function () { pm.expect(pm.response.code).to.be.oneOf([201, 400]); });
          pm.test(name + ': raises nothing - this input is legal', function () {
              MUST_NOT[name].forEach(function (c) {
                  pm.expect(codes, 'codes seen: ' + JSON.stringify(codes)).to.not.include(String(c));
              });
          });
      }
    language: text/javascript
