body:
  type: json
  content: |-
    {
      "customerId": 1,
      "agentRequest": { "requestReasonCode": 1, "certificateOfOriginTypeCode": 5, "exportDeclarationNum": "260146" },
      "certificateOfOrigin": { "customsHouse": "SITE01" },
      "nonManipulationCertificate": {
        "exportDate": "{{twoDaysAgo}}",
        "exportCountry": "IL",
        "importBillOfLadingNum": "IBL1",
        "exportPort": "DEHAM",
        "importDate": "{{tenDaysAgo}}",
        "exportBillOfLadingNum": "EBL1",
        "transitCountry": "IL",
        "portOfEntrance": "ILHFA",
        "expectedExitDate": "{{inOneMonth}}",
        "exitPort": "ILASH",
        "goodsDescription": "widgets",
        "declaringCompany": "Acme",
        "declaringPerson": "John",
        "declaringPosition": "Manager",
        "manifestNum": "MAN1"
      }
    }
order: 41010
