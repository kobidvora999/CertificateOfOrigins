$kind: http-request
url: "{{baseUrl}}/community/certificate-of-origins"
method: POST
headers:
  MessageSenderId: "1"
  Content-Type: application/json
# CheckExportCountry is inverted for NonManipulation: the export country must NOT be Israel. IL therefore raises ExportCounrtyIllegal(5016) - the second of its two arms, and the one the shipped fixture never reached because it sends DE.
# The ride-along certificateOfOrigin (it is read only for customsHouse) carries the four exporter fields the contract requires as empty strings; a NonManipulation request does not validate them.
body:
  type: json
  content: |-
    {
            "agentRequest": { "internalApplication": "internal-workload", "requestReasonCode": 1, "certificateOfOriginTypeCode": 5, "exportDeclarationNum": "260146" },
      "certificateOfOrigin": { "exporterId": "", "exporterName": "", "exporterAddress": "", "exporterCountry": "", "customsHouse": "SIT01" },
      "nonManipulationCertificate": {
        "exportDate": "{{twoDaysAgo}}",
        "exportCountry": "IL",
        "importBillOfLadingNum": "IBL1",
        "exportPort": "DEHAM",
        "importDate": "{{tenDaysAgo}}",
        "exportBillOfLadingNum": "EBL1",
        "transitCountry": "IL",
        "portOfEntrance": "ILHFA",
        "expectedExitDate": "{{inOneMonth}}",
        "exitPort": "ILASH",
        "goodsDescription": "widgets",
        "declaringCompany": "Acme",
        "declaringPerson": "John",
        "declaringPosition": "Manager",
        "manifestNum": "MAN1"
      }
    }
order: 41010
