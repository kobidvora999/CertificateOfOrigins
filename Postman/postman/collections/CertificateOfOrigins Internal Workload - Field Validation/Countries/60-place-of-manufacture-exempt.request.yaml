$kind: http-request
url: "{{baseUrl}}/community/CertificateOfOrigins/Request"
method: POST
headers:
  Content-Type: application/json
# CheckIfExemptPlaceOfManufacture runs ONLY for EUR1(2) and only when the destination country id is in the
# CountriesExemptedFromSendingThePlaceOfManufacture parameter, whose value here is 804. The Country mock derives a
# non-IL id as (sum of chars %% 1000) + 1, so the destination code has to sum to 803 - "zzzzzzG" does (122*6 + 71).
# It looks strange because it is arithmetic, not a country: the mock accepts any string, and this is the only way
# to hit 804 without editing the parameter. The place-of-manufacture value is cleared and nothing is raised.
body:
  type: json
  content: |-
    {
      "customerId": 1,
      "agentRequest": { "requestReasonCode": 1, "certificateOfOriginTypeCode": 2, "exportDeclarationNum": "260146" },
      "certificateOfOrigin": {
        "exporterId": "EXP1", "exporterName": "Acme", "exporterAddress": "1 Main St",
        "tradeAgreementCountry2": "DE",
        "isCumulation": true, "cumulationCountry": "DE",
        "originCountry": "IL",
        "placeOfManufacture": 1, "zipCodeOfManufacture": "6100000",
        "consigneeName": "Buyer", "consigneeAddress": "2 St", "consigneeCountry": "DE",
        "customsHouse": "SITE01",
        "dateOfDeclaration": "{{twoDaysAgo}}",
        "exporterCountry": "IL", "tradeAgreementCountry1": "IL", "issuingCountry": "IL",
        "countryOfDeclaration": "IL", "cityOfDeclaration": 1, "destinationCountry": "zzzzzzG",
        "invoiceDetails": [
          { "invoiceNum": "INV1", "invoiceDate": "{{tenDaysAgo}}", "descriptionOfInvoice": "goods",
            "itemDetails": [ { "itemId": "123456", "marksAndNumbers": "M1", "itemDescription": "widget",
              "originCriterion": "A", "measureType": "KG", "packageType": "BX" } ] } ]
      }
    }
order: 40050
