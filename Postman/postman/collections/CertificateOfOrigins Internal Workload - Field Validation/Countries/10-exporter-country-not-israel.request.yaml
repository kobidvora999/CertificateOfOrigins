  type: json
  content: |-
    {
      "customerId": 1,
      "agentRequest": { "requestReasonCode": 1, "certificateOfOriginTypeCode": 1, "exportDeclarationNum": "260146" },
      "certificateOfOrigin": {
        "exporterId": "EXP1", "exporterName": "Acme", "exporterAddress": "1 Main St",
        "tradeAgreementCountry2": "DE",
        "isCumulation": true, "cumulationCountry": "DE",
        "originCountry": "IL",
        "placeOfManufacture": 1, "zipCodeOfManufacture": "6100000",
        "consigneeName": "Buyer", "consigneeAddress": "2 St", "consigneeCountry": "DE",
        "customsHouse": "SITE01",
        "dateOfDeclaration": "{{twoDaysAgo}}",
        "exporterCountry": "DE", "tradeAgreementCountry1": "IL", "issuingCountry": "IL",
        "countryOfDeclaration": "IL", "cityOfDeclaration": 1, "destinationCountry": "DE",
        "invoiceDetails": [
          { "invoiceNum": "INV1", "invoiceDate": "{{tenDaysAgo}}", "descriptionOfInvoice": "goods",
            "itemDetails": [ { "itemId": "123456", "marksAndNumbers": "M1", "itemDescription": "widget",
              "originCriterion": "A", "measureType": "KG", "packageType": "BX" } ] } ]
