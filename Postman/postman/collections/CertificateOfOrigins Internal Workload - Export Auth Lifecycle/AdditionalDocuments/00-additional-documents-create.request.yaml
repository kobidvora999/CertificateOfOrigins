$kind: http-request
url: "{{baseUrl}}/ui/ExportDocumentAuthenticationRequest"
method: POST
headers:
  Content-Type: application/json
# AD: a new export request with one additional document. The BL links it to the saved request through
# IDocumentUtil.SaveDocumentToEntity (POST {Documents}/document/SaveDocumentToEntity {documentId, entityId, entityTypeId});
# under x-mock-mode the platform mocks the util, so this proves the attach path runs end to end without an error.
body:
  type: json
  content: |-
    {
      "id": 0,
      "state": 1,
      "organizationUnitId": 1,
      "statusId": 1,
      "originalStatusId": 0,
      "deliveryMethodId": 1,
      "title": "בקשת אימות מסמך יצוא",
      "customerId": 777,
      "exporterCustomerId": 888,
      "typeId": 1,
      "countryId": 32,
      "authenticationRequestNotes": "additional documents",
      "invoiceNumbers": "EXP-AD-{{runId}}",
      "listOfAdditionalDocumentsIds": [5],
      "customsItems": [
        {
          "id": 0,
          "exportDocumentAuthenticationRequestId": 0,
          "customsItemId": 5001
        }
      ],
      "leadDocuments": [
        {
          "id": 0,
          "exportRequestId": 0,
          "leadDocumentId": 6001,
          "leadDocumentTitle": "Lead doc A"
        }
      ],
      "manufacturingAreas": [
        {
          "id": 0,
          "exportAuthenticationRequestId": 0,
          "manufacturingArea": "Haifa",
          "manufacturingZipcode": "3100000"
        }
      ],
      "authenticationDocumentTypeId": 1
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      let j = {};
      try { j = pm.response.json() || {}; } catch (e) { /* asserted below */ }
      pm.test('AD: the request with an additional document is saved', () => pm.expect(j.id, 'id').to.be.a('number').and.above(0));
order: 4000
