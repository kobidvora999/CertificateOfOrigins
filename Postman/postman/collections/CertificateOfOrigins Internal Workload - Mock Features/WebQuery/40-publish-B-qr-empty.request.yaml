$kind: http-request
url: "{{baseUrl}}/CertificateOfOrigins"
method: POST
headers:
  Content-Type: application/json
  x-mock-feature--Qr.Empty: "true"
# CreateQrCode returns null -> CreateQrCodeIfNeeded returns null and UploadQrCodeDocument is skipped: the 'no QR produced' side of the publish.
body:
  type: json
  content: |-
    {
      "id": {{mfCertB}},
      "timeStamp": "{{mfTsB}}",
      "typeId": 2, "state": 1, "title": "mock-features publish B",
      "organizationUnitId": 1, "customerId": 777, "createCustomerId": 777,
      "certificateNumber": "MF-COO-B",
      "certificateOfOriginStatusId": 8,
      "originalCertificateOfOriginStatusId": 2,
      "requestReasonCode": 2,
      "exportDeclarationNumber": "260146",
      "isLastVersion": true, "versionNumber": 1,
      "certificateOfOriginDetails": [
        { "certificateDetailsTypeCodeId": 2, "value": "יצואן לדוגמה" },
        { "certificateDetailsTypeCodeId": 13, "value": "32" }
      ],
      "certificateOfOriginInvoiceDetail": [
        { "id": 0, "invoiceNumber": "INV-MF-COO-B", "invoiceAmount": 100, "invoiceDate": "{{tenDaysAgo}}",
          "invoiceGoodsDescription": "goods", "isToPrint": true, "currencyTypeId": 1 }
      ]
    }
order: 60400
