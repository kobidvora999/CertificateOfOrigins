$kind: http-request
url: "{{baseUrl}}/CertificateOfOrigins"
method: POST
headers:
  Content-Type: application/json
  x-mock-feature--Templates.Empty: "true"
# GenerateTemplate returns null -> PrintCertificateOfOriginAndSaveAttachments' 'nothing rendered' branch, so no attachment is saved.
body:
  type: json
  content: |-
    {
      "id": {{mfCertC}},
      "timeStamp": "{{mfTsC}}",
      "typeId": 2, "state": 1, "title": "mock-features publish C",
      "organizationUnitId": 1, "customerId": 777, "createCustomerId": 777,
      "certificateNumber": "MF-COO-C",
      "certificateOfOriginStatusId": 8,
      "originalCertificateOfOriginStatusId": 2,
      "requestReasonCode": 2,
      "exportDeclarationNumber": "260146",
      "isLastVersion": true, "versionNumber": 1,
      "certificateOfOriginDetails": [
        { "certificateDetailsTypeCodeId": 2, "value": "יצואן לדוגמה" },
        { "certificateDetailsTypeCodeId": 13, "value": "32" }
      ],
      "certificateOfOriginInvoiceDetail": [
        { "id": 0, "invoiceNumber": "INV-MF-COO-C", "invoiceAmount": 100, "invoiceDate": "{{tenDaysAgo}}",
          "invoiceGoodsDescription": "goods", "isToPrint": true, "currencyTypeId": 1 }
      ]
    }
order: 60600
