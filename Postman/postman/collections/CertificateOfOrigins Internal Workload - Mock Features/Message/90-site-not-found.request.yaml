$kind: http-request
url: "{{baseUrl}}/community/CertificateOfOrigins/Request"
method: POST
headers:
  MessageSenderId: "1"
  Content-Type: application/json
  x-mock-feature--Site.NotFound: "true"
# Site.NotFound -> CheckIfSiteExistAndCustomsHouse returns EARLY (the branch ABOVE the org-unit check), so 5007 is
# never raised AND context.OrganizationUnitId is never set. Since C-02 (87f5039) the save no longer requires
# OrganizationUnitId > 0: the message is accepted and the certificate is stored with organizationUnitId 0 (read at 95).
body:
  type: json
  content: |-
    {
            "agentRequest": { "requestReasonCode": 1, "certificateOfOriginTypeCode": 1, "exportDeclarationNum": "260146" },
      "certificateOfOrigin": {
        "exporterId": "EXP1", "exporterName": "Acme", "exporterAddress": "1 Main St", "exporterCountry": "IL",
        "tradeAgreementCountry1": "IL", "tradeAgreementCountry2": "DE",
        "isCumulation": true, "cumulationCountry": "DE",
        "originCountry": "IL", "destinationCountry": "DE",
        "placeOfManufacture": 1, "zipCodeOfManufacture": "6100000",
        "consigneeName": "Buyer", "consigneeAddress": "2 St", "consigneeCountry": "DE",
        "customsHouse": "SITE01", "issuingCountry": "IL", "cityOfDeclaration": 1, "countryOfDeclaration": "IL",
        "dateOfDeclaration": "{{twoDaysAgo}}",
        "invoiceDetails": [
          { "invoiceNum": "INV1", "invoiceDate": "{{tenDaysAgo}}", "descriptionOfInvoice": "goods",
            "invoiceSum": 100, "currencyType": "USD",
            "itemDetails": [ { "itemId": "123456", "marksAndNumbers": "M1", "itemDescription": "widget",
              "originCriterion": "A", "measureType": "KG", "packageType": "BX", "packageQuantity": 1, "weight": 10 } ] } ]
      }
    }
order: 10900
