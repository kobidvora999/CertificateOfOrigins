$kind: http-request
url: "{{baseUrl}}/CertificateOfOrigins/Request"
method: POST
headers:
  Content-Type: application/json
  x-mock-feature--ExportDealFile.NotFound: "true"
# ExportDealFile.NotFound -> the declaration resolves to NULL. Two branches at once: CheckExportDeclarationNumber
# skips its state check, and GetDeclarationInfoForReconciliation returns null so the whole post-save reconciliation
# is skipped. Proof is the contrast with the control: reason 2 WITHOUT this flag comes back status 3 (Rejected) with
# four reconciliation findings; with it, status 2 and no exceptions at all. reason 2 (Retrospective) is required -
# reason 1 never calls CheckExportDeclarationNumber.
body:
  type: json
  content: |-
    {
      "customerId": 1,
      "agentRequest": { "requestReasonCode": 2, "certificateOfOriginTypeCode": 1, "exportDeclarationNum": "260146" },
      "certificateOfOrigin": {
        "exporterId": "EXP1", "exporterName": "Acme", "exporterAddress": "1 Main St", "exporterCountry": "IL",
        "tradeAgreementCountry1": "IL", "tradeAgreementCountry2": "DE",
        "isCumulation": true, "cumulationCountry": "DE",
        "originCountry": "IL", "destinationCountry": "DE",
        "placeOfManufacture": 1, "zipCodeOfManufacture": "6100000",
        "consigneeName": "Buyer", "consigneeAddress": "2 St", "consigneeCountry": "DE",
        "customsHouse": "SITE01", "issuingCountry": "IL", "cityOfDeclaration": 1, "countryOfDeclaration": "IL",
        "dateOfDeclaration": "{{twoDaysAgo}}",
        "invoiceDetails": [
          { "invoiceNum": "INV1", "invoiceDate": "{{tenDaysAgo}}", "descriptionOfInvoice": "goods",
            "invoiceSum": 100, "currencyType": "USD",
            "itemDetails": [ { "itemId": "123456", "marksAndNumbers": "M1", "itemDescription": "widget",
              "originCriterion": "A", "measureType": "KG", "packageType": "BX", "packageQuantity": 1, "weight": 10 } ] } ]
      }
    }
order: 11200
