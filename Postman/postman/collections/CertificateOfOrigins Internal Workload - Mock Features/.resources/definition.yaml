$kind: collection
id: certificateoforigins-mock-features-v1
name: CertificateOfOrigins Mock Features
description: >-
  The MOCK lever, which no collection had used. The service ships 34 scenario flags in its mock proxies
  (IProxyMockUtil.HasMockFeature), and before this collection ZERO of them were ever sent: every proxy always
  returned its happy answer, so the negative side of every proxy-driven `if` was dead code. That is why line
  coverage sat at 80.9%% while BRANCH coverage sat at 63.6%% - 548 of 1504 branches unentered.
  Each request here sends exactly ONE `x-mock-feature--{Flag}: true` header on an otherwise identical fixture,
  so any exception it raises can only be that flag's doing. The Message folder proves this with 00-baseline:
  the same body, no flag, no codes.
  THREE FLAGS ARE DELIBERATELY NOT EXERCISED - Collateral.ChangeFail, Collateral.GrantFail and
  MessageManagement.Fail all throw InvalidOperationException inside the mock. They add no branch (the exception
  aborts the call) and the BL does not catch them, so they would surface as 500. Whether a downstream transport
  failure SHOULD be a 500 or a 502 is a contract question for the developer; asserting the current 500 would
  freeze an unreviewed answer. See reports/gap-analysis.md.
  AuthRequest creates the request and file it reads (01/02) - no seed.
variables:
  baseUrl: http://localhost:9034
scripts:
  - type: http:beforeRequest
    code: |-
      // Platform mock convention (InfrastructureCore.Proxy 1.10.86): REAL proxies are the default; the single
      // global header 'x-mock-mode: x-mock-mode' switches ALL proxies to their in-service mock. Per-scenario
      // flags are carried in the header NAME with a DOUBLE dash - 'x-mock-feature--{Flag}: true' - because
      // ProxyMockUtil.HasMockFeature(name) reads 'x-mock-feature-' + '-name'. Those per-request headers live in
      // the request yaml, not here: one flag per scenario is the whole point.
      pm.request.headers.upsert({ key: 'x-mock-mode', value: 'x-mock-mode' });
      pm.request.headers.upsert({ key: 'CC-USER-ID', value: '5' });
      // DocumentID of the AuthRequest setup: 800000000 + (ms % 1e6) * 100 + SLOT * 10 + k, SLOT 5 (see Auth Lifecycle).
      if (pm.info.requestName === '01-create-request' || !pm.collectionVariables.get('mfDoc')) {
          pm.collectionVariables.set('mfDoc', 800000000 + (Date.now() % 1000000) * 100 + 5 * 10 + 1);
      }
      // Run-scoped suffix for every certificate number this collection creates: a fixed number would hit the
      // existing-number branch (new version, old one cancelled) from the second run on. Re-minted on the first request.
      if (pm.info.requestName === '00-baseline' || !pm.collectionVariables.get('runId')) {
          pm.collectionVariables.set('runId', String(Date.now()));
      }

      var iso = function (d) { return new Date(d).toISOString().slice(0, 10) + 'T00:00:00'; };
      var now = Date.now(), DAY = 86400000;
      pm.collectionVariables.set('today', iso(now));
      pm.collectionVariables.set('twoDaysAgo', iso(now - 2 * DAY));
      pm.collectionVariables.set('tenDaysAgo', iso(now - 10 * DAY));
      pm.collectionVariables.set('inOneMonth', iso(now + 30 * DAY));
    language: text/javascript
  - type: http:afterResponse
    code: |-
      var name = pm.info.requestName;
      var body = pm.response.text();
      var j = null; try { j = pm.response.json(); } catch (e) { j = null; }

      pm.test('no server error (5xx)', function () {
          pm.expect(pm.response.code, 'HTTP ' + pm.response.code).to.be.below(500);
      });

      // Most scenarios answer 200 with the branch visible in the body. The two ExportDoc reads do NOT: a customer the
      // Customers service does not know is refused with a 400 naming the field, as legacy (b720c6a, bdb1866).
      // The certificate-of-origin message (pure REST, alternative 2) is split by method: POST community/certificate-of-origins
      // creates (201), PUT /{id} updates (200), POST /{idToCancel}/Replacement replaces (201), DELETE /{id} cancels (200).
      // A message the validation rejects is 400 (errors[].errorCode = the legacy exceptionType as a STRING); a saved
      // certificate keeps its reconciliation findings in exception[] of the 201/200.
      var EXPECT_STATUS = {
          '10-customer-information-not-found': 400,
          '20-customers-by-country-not-found': 400,
          // message creates whose certificate is saved (reconciliation findings, if any, ride in exception[])
          '00-setup-cancel': 201, '00-setup-supersede': 201, '00-setup-importreplace': 201, '00-baseline': 201,
          '120-declaration-unresolvable': 201,
          '10-declaration-not-released': 201, '20-no-declaration-invoices': 201, '25-lead-document-title-mismatch': 201,
          '30-customs-item-mismatch': 201, '40-no-assessor': 201, '50-destination-not-in-group': 201,
          '10-no-associated-goods-items': 201,   // POST {certIdImportMf}/Replacement, reason 5
          '10-update-no-lead-document': 200,     // PUT {certIdSupersedeMf}, reason 3
          // messages the flipped mock makes the validation reject (was 200 with the code in-band)
          '10-country-not-found': 400, '20-not-in-agreement': 400, '30-customs-item-not-found': 400,
          '40-measurement-unit-not-found': 400, '50-packing-type-not-found': 400, '60-currency-not-found': 400,
          '70-exporter-not-found': 400, '80-orgunit-not-customs-house': 400, '90-site-not-found': 400,
          '100-group-not-exists': 400, '110-group-not-in-agreement': 400, '130-declaration-in-amendment': 400,
          '10-cancel-with-live-declaration': 400 // DELETE {certIdCancelMf}, blocked by the live declaration
      };
      var REFUSED_FIELD = {
          '10-customer-information-not-found': ['customerId', 'הלקוח לא קיים במערכת'],
          '20-customers-by-country-not-found': ['countryId', 'לא הוגדר בית מכס למדינה זו. יש להגדיר כתובת מתאימה']
      };
      var expected = EXPECT_STATUS[name] || 200;
      pm.test('status is ' + expected, function () { pm.response.to.have.status(expected); });

      if (REFUSED_FIELD[name] && j) {
          pm.test(name + ': refused on ' + REFUSED_FIELD[name][0] + ' with the legacy message', function () {
              var err = (j.errors || []).filter(function (e) { return e.field === REFUSED_FIELD[name][0]; })[0];
              pm.expect(err, 'error on ' + REFUSED_FIELD[name][0]).to.not.be.undefined;
              pm.expect(err.detail, 'detail').to.include(REFUSED_FIELD[name][1]);
          });
      }

      // C-02 (87f5039): the unresolved site leaves the org unit unset, and the save no longer requires one.
      // Pure REST: "nothing saved" is the 400 itself (legacy answered applicationId 0 in-band) - asserted above.
      if (name === '90-site-not-found' && j) {
          pm.test('90-site-not-found: rejected, nothing saved (legacy GetIdByCode miss, C-F05)', function () {
              pm.expect(j.applicationId, 'no certificate in a ProblemDetails').to.be.undefined;
          });
      }

      // ---- AuthRequest setup and reads: every read must be of the request / file created at 01-02 ----

      var mfDoc = Number(pm.collectionVariables.get('mfDoc'));

      if (name === '02-create-file' && j) { pm.collectionVariables.set('mfFileId', j.id); }

      if (name === '01-create-request') {

          pm.test('01: the request was inserted', function () { pm.expect(j.documentId, 'documentId').to.eql(mfDoc); });

      }

      if (['10-collateral-empty', '20-tasks-empty', '30-document-by-id-not-found', '40-no-submission-date'].indexOf(name) >= 0) {

          pm.test(name + ': read the request created at 01', function () { pm.expect(j.documentId, 'documentId').to.eql(mfDoc); });

      }

      if (name === '50-file-tasks-empty') {

          pm.test('50: read the file created at 02, holding the request', function () {

              pm.expect(j.id, 'id').to.eql(Number(pm.collectionVariables.get('mfFileId')));

              pm.expect((j.requests || []).map(function (r) { return r.documentId; }), 'children').to.include(mfDoc);

          });

      }

      if (name === '60-importers-not-found' || name === '70-vendors-not-found') {

          pm.test(name + ': the filter found exactly the request created at 01', function () {

              pm.expect(j, 'rows').to.be.an('array').with.lengthOf(1);

              pm.expect(j[0].documentId, 'documentId').to.eql(mfDoc);

          });

      }

      // ---- captures (before the assertions, so a failed assertion cannot break the chain) ----
      var SETUP_VAR = {
          '00-setup-cancel':        'certIdCancelMf',
          '00-setup-supersede':     'certIdSupersedeMf',
          '00-setup-importreplace': 'certIdImportMf'
      };
      if (SETUP_VAR[name] && j) {
          // The pure-REST result is flat: the certificate number is j.certificateId (was j.feedback.certificateId).
          var made = j.certificateId;
          if (made) { pm.collectionVariables.set(SETUP_VAR[name], made); }
          pm.test(name + ': created a certificate to chain from', function () {
              pm.expect(made, 'certificateId').to.be.a('string').and.not.empty;
          });
      }
      var CERT_VAR = { '00-setup-A': 'mfCertA', '30-setup-B': 'mfCertB', '50-setup-C': 'mfCertC' };
      if (CERT_VAR[name] && j) {
          pm.collectionVariables.set(CERT_VAR[name], j.id);
          pm.test(name + ': saved at status Received', function () {
              pm.expect(j.id, 'id').to.be.a('number').and.not.equal(0);
              pm.expect(j.certificateOfOriginStatusId, 'status').to.eql(2);
          });
      }
      var TS_VAR = { '05-read-A': 'mfTsA', '35-read-B': 'mfTsB', '55-read-C': 'mfTsC' };
      if (TS_VAR[name] && j) {
          pm.collectionVariables.set(TS_VAR[name], j.timeStamp);
          pm.test(name + ': rowversion available for the publish step', function () {
              pm.expect(j.timeStamp, 'timeStamp - without it the publish cannot be an UPDATE').to.be.a('string').and.not.empty;
          });
      }
      if (name === '15-read-A-guid' && j) {
          pm.collectionVariables.set('mfGuidA', j.guid);
          // The Guid is stamped ONLY by CreateQrCodeIfNeeded, which only runs on a real transition into
          // Published. Its presence is the proof that PublishAttachments actually ran.
          pm.test('publish stamped the Guid (PublishAttachments ran)', function () {
              pm.expect(j.guid, 'guid').to.be.a('string').and.not.empty;
          });
      }

      // Message codes: errors[] of a 400 (errorCode = legacy exceptionType as a STRING, detail[0] = its text) and
      // exception[] of a saved certificate (reconciliation warnings). Read from both, codes as strings.
      var errList = (j && j.errors) ? j.errors : [];
      var exList = (j && j.exception) ? j.exception : [];
      var codes = errList.map(function (e) { return String(e.errorCode); })
          .concat(exList.map(function (e) { return String(e.exceptionType); }));
      var descr = errList.map(function (e) { return (e.detail || []).join(' '); })
          .concat(exList.map(function (e) { return e.exceptionDescription || ''; })).join(' | ');

      // ---- message codes the flipped mock must raise (now on the 400; were in-band under 200) ----
      var MUST = {
          '10-country-not-found':            [14027393],
          '20-not-in-agreement':             [4990, 4995, 4997, 5000, 5004],
          '30-customs-item-not-found':       [5012],
          '40-measurement-unit-not-found':   [650],
          '50-packing-type-not-found':       [650],
          '60-currency-not-found':           [650],
          '70-exporter-not-found':           [4978],
          '80-orgunit-not-customs-house':    [5007],
          '100-group-not-exists':            [650],
          '90-site-not-found':               [650],
          '110-group-not-in-agreement':      [5002],
          '130-declaration-in-amendment':    [14027175],
          '10-cancel-with-live-declaration': [14027174]
      };
      var MUST_NOT = {
          // The site itself does not resolve, so CheckIfSiteExistAndCustomsHouse returns before the org-unit
          // check - the customs-house error must NOT appear. This is the branch ABOVE 5007.
          '90-site-not-found': [5007],
          // Every code a sibling scenario asserts. The fixture alone must raise none of them.
          '00-baseline': [14027393, 4990, 4995, 4997, 5004, 5012, 650, 4978, 5007, 5002, 14027175]
      };
      // Code 650 (TheValueInFieldNotExistsInSystem) is shared by four resolvers, so the code alone would not
      // say WHICH one fired. The message carries the field name; assert that too.
      var MUST_SAY = {
          '40-measurement-unit-not-found': 'MeasureType',
          '50-packing-type-not-found':     'PackageType',
          '60-currency-not-found':         'CurrencyType',
          '100-group-not-exists':          'DestinationGroupOfCountries',
          '90-site-not-found':             'CustomsHouse'
      };
      // Reconciliation findings carry ExceptionType 0 (the real EMessages codes are still a migration TODO,
      // CertificateOfOriginsBl.cs:2021), so they can only be identified by their text.
      var MUST_CONTAIN = {
          // NOT the 6-digit mismatch: verified live, the mock declaration goods item carries CertificateOfOriginId
          // 0, so the certificate-link check fires first and returns. See gap-analysis.md.
          '30-customs-item-mismatch':     'מספר תעודה אינו תואם את מספר התעודה שדווח בהצהרת היצוא',
          // The save's lead-document title check joins the reconciliation as an Error (legacy _requestExceptions).
          '25-lead-document-title-mismatch': 'מספר תעודה אינו תואם את מספר התעודה שדווח בהצהרת היצוא',
          '50-destination-not-in-group':  'אי התאמה בין המדינות בהסכם לעומת מדינת הקונה',
          '10-no-associated-goods-items': 'לא קיימת בהצהרה סחורה המקושרת להצהרת היבוא'
      };
      var MUST_NOT_CONTAIN = {
          // B-M1 (d2014fe): legacy rejects a certificate whose declaration has no invoices WITHOUT a finding.
          '20-no-declaration-invoices':   ['אין חשבוניות בהצהרת היצוא'],
          // LeadDocumentState 0 fails ReconcileWithSubmittedDeclaration's gate, so NO reconciliation finding
          // may appear - that is the whole branch under test.
          '10-declaration-not-released': ['אין חשבוניות בהצהרת היצוא', 'בתעודה אינו קיים או חסר בחשבונית']
      };

      if (MUST[name]) {
          MUST[name].forEach(function (c) {
              pm.test(name + ': errors[] carries errorCode ' + c, function () {
                  pm.expect(codes, 'codes seen: ' + JSON.stringify(codes)).to.include(String(c));
              });
          });
      }
      if (MUST_NOT[name]) {
          pm.test(name + ': raises none of the flagged codes', function () {
              MUST_NOT[name].forEach(function (c) { pm.expect(codes).to.not.include(String(c)); });
          });
      }
      if (MUST_SAY[name]) {
          pm.test(name + ': the 650 names ' + MUST_SAY[name], function () {
              pm.expect(descr).to.include(MUST_SAY[name]);
          });
      }
      if (MUST_CONTAIN[name]) {
          pm.test(name + ': reconciliation raised its finding', function () {
              pm.expect(body).to.include(MUST_CONTAIN[name]);
          });
      }
      if (MUST_NOT_CONTAIN[name]) {
          pm.test(name + ': the reconciliation was skipped entirely', function () {
              MUST_NOT_CONTAIN[name].forEach(function (t) { pm.expect(body).to.not.include(t); });
          });
      }

      // ---- scenarios whose branch has no visible output: coverage is the proof ----
      // 40-no-assessor, 10-update-no-lead-document and the AuthRequest/ExportDoc reads all change only what an
      // enrichment leaves unset. Asserting "field is absent" would also pass if the endpoint silently broke, so
      // the status assertions above are the contract and the cobertura delta is the proof.
      // The declaration resolves to null, so nothing is reconciled. Proved by contrast with the control run:
      // reason 2 WITHOUT this flag answers status 3 (Rejected) carrying four reconciliation findings.
      if (name === '120-declaration-unresolvable') {
          pm.test('120: no declaration resolved, so the reconciliation never ran', function () {
              pm.expect(exList, 'exception').to.be.an('array').that.is.empty;
              pm.expect(j.certificateOfOriginStatusCode, 'status stays Received (2), not Rejected (3)').to.eql(2);
          });
      }
      if (name === '10-publish-A') {
          pm.test('10-publish-A: published and stamped an issuing date', function () {
              pm.expect(j.certificateOfOriginStatusId, 'status').to.eql(8);
              pm.expect(j.issuingDate, 'issuingDate is stamped by PublishAttachments').to.be.a('string').and.not.empty;
          });
      }
      if (name === '40-publish-B-qr-empty' || name === '60-publish-C-templates-empty') {
          pm.test(name + ': the publish transition was accepted', function () {
              pm.expect(j && j.certificateOfOriginStatusId, 'status').to.eql(8);
          });
      }
    language: text/javascript
