# (the exception gate runs before CancelCertificateOfOriginFromMessage). The default mock returns null, so this
# whole arm was dead.
# WHICH implementation: the CANCEL branch has its OWN inline copy of the check (CertificateOfOriginsBl.cs:150-154)
# and that is the one this covers - verified by line hits. The sibling CheckDeclarationAssociatedWithCertificate
# (MessagePerReason.cs:201) sits on the CREATE branch via ResolveCertificateForReason and is NOT reached by
# reason 14; it stayed at 0/8. Two implementations of one legacy check - flagged in gap-analysis.md.
