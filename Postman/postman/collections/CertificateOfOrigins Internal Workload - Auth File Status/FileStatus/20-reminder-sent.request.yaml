$kind: http-request
url: "{{baseUrl}}/ui/AuthenticationRequest/SaveFile"
method: POST
headers:
  Content-Type: application/json
# AuthenticationRequestReminderWasSend(3) -> CheckStatusAndOpenTask fires UpdateFileStatusVendorReminderNotice. It is NOT one of the open-task statuses, so the handling task is deliberately not opened.
body:
  type: json
  content: |-
    {
      "id": {{fileId}},
      "authenticationFileStatusId": 3,
      "originalAuthenticationFileStatusId": {{fileStatus}},
      "notes": null, "postalAdress": "flow address", "deliveryMethodId": 1,
      "emailAdress": "flow@example.com", "reminderMethodId": 1, "requestCountryId": 32,
      "userId": 5, "userNameIssuingLetter": "flow user",
      "lastDelivery": null, "importerContactingReasonId": null, "firstProvideContactDate": null,
      "organizationUnitId": 1,
      "requests": [
        { "documentId": {{docFileA}}, "authenticationFileId": {{fileId}}, "decisionId": 3, "originalRequestDecisionId": {{decA}},
          "documentIssuingDate": "{{today}}", "organizationUnitId": 1, "userId": 5, "userResponseId": 5 }]
    }
order: 30010
