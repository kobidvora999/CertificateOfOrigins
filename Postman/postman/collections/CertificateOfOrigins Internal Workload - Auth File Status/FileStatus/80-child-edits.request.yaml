$kind: http-request
url: "{{baseUrl}}/ui/AuthenticationRequest/File/{{fileId}}"
method: PUT
headers:
  Content-Type: application/json
# The coordinator's edits to a child request on the file screen (legacy UpdateAndSaveImportAuthenticationRequest,
# a full Repository.Save per child). The file status is left unchanged (10 -> 10, after 70), so only the child
# write runs. The client always sends back every child as it read it (legacy saved that entity, null included —
# parity finding FN-03): docFileB round-trips its stored values unchanged; docFileA carries edits and omits
# importerId, which legacy cleared.
body:
  type: json
  content: |-
    {
      "id": {{fileId}},
      "authenticationFileStatusId": 10,
      "originalAuthenticationFileStatusId": {{fileStatus}},
      "notes": null, "postalAdress": "flow address", "deliveryMethodId": 1,
      "emailAdress": "flow@example.com", "reminderMethodId": 1, "requestCountryId": 32,
      "userId": 5, "userNameIssuingLetter": "flow user",
      "lastDelivery": null, "importerContactingReasonId": null, "firstProvideContactDate": null,
      "organizationUnitId": 1,
      "requests": [
        { "documentId": {{docFileA}}, "authenticationFileId": {{fileId}}, "decisionId": 10, "originalRequestDecisionId": {{decA}},
          "documentIssuingDate": "{{today}}", "organizationUnitId": 1, "userId": 5, "userResponseId": 5,
          "decisionCircumstences": "PM circumstances 80", "cirumstanceDetails": "PM details 80",
          "remarks": "PM remarks 80", "documentNumber": "DN-80", "vendorId": 779,
          "preferenceDocumentTypeId": 4 },
        { "documentId": {{docFileB}}, "authenticationFileId": {{fileId}}, "decisionId": {{decB}}, "originalRequestDecisionId": {{decB}},
          "documentIssuingDate": "{{today}}", "organizationUnitId": 1, "userId": 5, "userResponseId": 5,
          "vendorId": 778, "customerId": null, "importerId": 279367, "remarks": "flow file request B",
          "importCountryId": 32, "issuingCountryId": 32, "originCountryId": 32, "preferenceDocumentTypeId": 1 }]
    }
order: 30070
