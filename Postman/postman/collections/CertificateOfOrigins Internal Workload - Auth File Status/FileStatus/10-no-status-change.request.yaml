$kind: http-request
url: "{{baseUrl}}/ui/AuthenticationRequest/SaveFile"
method: POST
headers:
  Content-Type: application/json
# The file status equals the original -> ManageFileStatus returns immediately. The whole status machine is guarded by that one comparison, and no fixture had ever sent a NON-change, so the guard's true side was unrun.
body:
  type: json
  content: |-
    {
      "id": 990002,
      "authenticationFileStatusId": 1,
      "originalAuthenticationFileStatusId": 1,
      "notes": null, "postalAdress": "seed address 2", "deliveryMethodId": 1,
      "emailAdress": "seed2@example.com", "reminderMethodId": 1, "requestCountryId": 32,
      "userId": 5, "userNameIssuingLetter": "seed user 2",
      "lastDelivery": null, "importerContactingReasonId": null, "firstProvideContactDate": null,
      "organizationUnitId": 1,
      "requests": [
        { "documentId": 990105, "authenticationFileId": 990002, "decisionId": 3, "originalRequestDecisionId": 1,
          "documentIssuingDate": "{{today}}", "organizationUnitId": 1, "userId": 5, "userResponseId": 5 }]
    }
order: 30000
