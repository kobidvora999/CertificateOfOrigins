$kind: http-request
url: "{{baseUrl}}/ui/authentication-request/handle-import-delivery-for-importer-sent"
method: POST
headers:
  Content-Type: application/json
# F4: a letter to the importer about request A -> decision LetterForImporterWasSent (8); the file state is carried over.
body:
  type: json
  content: |-
    {
      "documentId": {{docA}},
      "organizationUnitId": 1,
      "authenticationFileId": {{fileId}},
      "authenticationFileStatusId": {{fileStatus}},
      "deliveryMethodId": {{fileDm}}
    }
order: 1300
