$kind: http-request
url: "{{baseUrl}}/community/CertificateOfOrigins/Request"
method: POST
headers:
  MessageSenderId: "1"
  Content-Type: application/json
# C-03: a GetRequestStatus message on the published certificate answers the status only - no attachment (the attachment follows the reason of the incoming message, not of the stored certificate).
body:
  type: json
  content: |-
    {
      "agentRequest": {
        "requestReasonCode": 13,
        "certificateOfOriginTypeCode": 1,
        "certificateId": "{{sqpNumber}}"
      }
    }
order: 5060
