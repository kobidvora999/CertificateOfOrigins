$kind: http-request
url: "{{baseUrl}}/community/CertificateOfOrigins/Request"
method: POST
headers:
  Content-Type: application/json
# C13: the agent asks for the status of the certificate it just sent - feedback only, status Received (2).
body:
  type: json
  content: |-
    { "customerId": 1, "agentRequest": { "requestReasonCode": 13, "certificateOfOriginTypeCode": 1, "certificateId": "{{sqCertNumber}}" } }
order: 3100
