$kind: collection
id: certificateoforigins-save-import-decisions-v1
name: CertificateOfOrigins Save Import Decisions
description: >-
  Every arm of SaveImportAuthenticationRequest's decision switch (AuthenticationRequestBl.cs:817).
  Scenarios 10-70 drive SEEDED rows through the update path; 80 inserts a brand-new request (a fresh DocumentID
  per run) - the path the legacy popup created requests through (Repository.Save upsert).
  REQUIRES the seed Postman/internal-workload-test/seed/seed_ImportAuthenticationRequests.sql, which now also
  creates 990103 / 990104. Those two are DEDICATED to this collection and deliberately separate from
  990101 / 990102: this save is a set-based UPDATE that writes AuthenticationFileID, DecisionID and VendorID,
  the Auth Lifecycle collection asserts exactly those columns, and the collections run in PARALLEL.
variables:
  baseUrl: http://localhost:9034
scripts:
  - type: http:beforeRequest
    code: |-
      pm.request.headers.upsert({ key: 'x-mock-mode', value: 'x-mock-mode' });
      pm.request.headers.upsert({ key: 'CC-USER-ID', value: '5' });
      var iso = function (d) { return new Date(d).toISOString().slice(0, 10) + 'T00:00:00'; };
      pm.collectionVariables.set('today', iso(Date.now()));
      // 80 inserts a brand-new request, so it needs a DocumentID no earlier run has used (DocumentID is caller-assigned,
      // not an identity). A reused id would fall into the update path and prove nothing about the insert.
      if (pm.info.requestName === '80-new-request-insert') {
          pm.collectionVariables.set('newDocId', 800000000 + (Date.now() % 100000000));
      }
    language: text/javascript
  - type: http:afterResponse
    code: |-
      var name = pm.info.requestName;
      var j = null; try { j = pm.response.json(); } catch (e) { j = null; }

      // Every scenario must reach the tail and come back with the re-read graph.
      var expected = 200;
      pm.test('no server error (5xx)', function () {
          pm.expect(pm.response.code, 'HTTP ' + pm.response.code).to.be.below(500);
      });
      pm.test(name + ': status is ' + expected, function () { pm.response.to.have.status(expected); });

      if (name === '80-new-request-insert') {
          // Legacy Repository.Save was an upsert: the coordinator's "new authentication request" popup saves a
          // request that does not exist yet through this operation. The re-read returning the fresh DocumentID is
          // the proof the row was INSERTED (before the fix this was a 404).
          pm.test('80: a new request is inserted and read back', function () {
              pm.expect(j, 'body').to.be.an('object');
              pm.expect(j.documentId, 'documentId').to.eql(Number(pm.collectionVariables.get('newDocId')));
              pm.expect(j.decisionId, 'decisionId').to.eql(1);
              pm.expect(j.vendorId, 'vendorId').to.eql(777);
          });
          return;
      }

      // What each scenario sent, and therefore what the re-read must show. The response is
      // GetAuthenticationRequestByID's own graph, re-read AFTER the update - so these values coming back are the
      // proof that the switch ran, the save landed, and the method reached its last line. Several of the arms
      // (RaiseNewRequestEvent, the processed-after-rejection event, the rejection event) only raise events, which
      // the response cannot show; for those the status assertions are the contract and coverage is the proof.
      var SENT = {
          '10-new-request-with-file':   { doc: 990103, decision: 1, file: 990001, vendor: 777 },
          '20-new-request-no-file':     { doc: 990104, decision: 1, file: null,   vendor: 778 },
          '30-new-request-user-handles':{ doc: 990103, decision: 1, file: 990001, vendor: 777 },
          '40-new-request-task-exists': { doc: 990103, decision: 1, file: 990001, vendor: 777 },
          '50-authreq-rejected-task':   { doc: 990104, decision: 6, file: null,   vendor: 778 },
          '60-authreq-no-rejected':     { doc: 990104, decision: 6, file: null,   vendor: 778 },
          '70-needless-collaterals':    { doc: 990103, decision: 7, file: 990001, vendor: null }
      };
      var want = SENT[name];
      if (!want || !j) { return; }

      pm.test(name + ': re-read returned the row that was saved', function () {
          pm.expect(j.documentId, 'documentId').to.eql(want.doc);
          pm.expect(j.decisionId, 'decisionId - proves the set-based update landed').to.eql(want.decision);
      });

      if (want.file === null) {
          pm.test(name + ': authenticationFileId stayed null', function () {
              pm.expect(j.authenticationFileId).to.be.oneOf([null, undefined]);
          });
      } else {
          pm.test(name + ': authenticationFileId round-tripped', function () {
              pm.expect(j.authenticationFileId).to.eql(want.file);
          });
      }

      if (name === '70-needless-collaterals') {
          // Two things only this scenario reaches. VendorId 0 is normalised to null before the save
          // (AuthenticationRequestBl.cs:890), and the first collateral supplies CollateralId - both are visible
          // in the re-read, so this is a real assertion rather than a coverage-only one.
          pm.test('70: vendorId 0 was normalised to null', function () {
              pm.expect(j.vendorId, 'vendorId').to.be.oneOf([null, undefined]);
          });
          pm.test('70: CollateralId came from the first collateral', function () {
              pm.expect(j.collateralId, 'collateralId').to.eql(9901);
          });
      }
    language: text/javascript
