$kind: http-request
url: "{{baseUrl}}/community/CertificateOfOrigins/Request"
method: POST
headers:
  MessageSenderId: "1"
  Content-Type: application/json
# CheckManifestNumber: omitting BOTH manifestNum and exportDeclarationNum raises ManifestIdMissing AND ExportDeclarationMissing - two exceptions from one request.
body:
  type: json
  content: |-
    {
            "agentRequest": { "requestReasonCode": 1, "certificateOfOriginTypeCode": 5 },
      "certificateOfOrigin": { "customsHouse": "SITE01" },
      "nonManipulationCertificate": {
        "exportDate": "{{twoDaysAgo}}", "exportCountry": "DE", "importBillOfLadingNum": "IBL1", "exportPort": "DEHAM",
        "importDate": "{{tenDaysAgo}}", "exportBillOfLadingNum": "EBL1", "transitCountry": "IL", "portOfEntrance": "ILHFA",
        "expectedExitDate": "{{inOneMonth}}", "exitPort": "ILASH", "goodsDescription": "widgets",
        "declaringCompany": "Acme", "declaringPerson": "John", "declaringPosition": "Manager"
      }
    }
order: 15000
