$kind: http-request
url: "{{baseUrl}}/ui/certificate-of-origins"
method: POST
headers:
  Content-Type: application/json
# A PUBLISHED row to point the per-reason checks at. Saved straight at status 8 - that is NOT a status CHANGE for a new instance (CertificateOfOriginsBl.cs:942) so no publish side effects fire; all this scenario needs is the row. Created at Received (2); 01-publish-C moves it to 8 through the status save.
# createCustomerId is 1, the MessageSenderId every message request here sends: the pure-REST message endpoints answer 404 for a certificate another agent created (GetSenderCertificate), so a row the messages target must be the sender's own.
body:
  type: json
  content: |-
    {
      "id": 0, "state": 1, "typeId": 1, "title": "per-reason fixture PR-PUB-C-{{runId}}",
      "organizationUnitId": 1, "customerId": 777, "createCustomerId": 1,
      "certificateNumber": "PR-PUB-C-{{runId}}",
      "certificateOfOriginStatusId": 2,
      "originalCertificateOfOriginStatusId": 0,
      "requestReasonCode": 1,
      "isLastVersion": true, "versionNumber": 1,
      "certificateOfOriginDetails": [ { "certificateDetailsTypeCodeId": 2, "value": "יצואן" } ]
    }
order: 10002
