$kind: collection
id: certificateoforigins-per-reason-v1
name: CertificateOfOrigins Per Reason
description: >-
  ResolveCertificateForReason and its helpers (CertificateOfOriginsBl.MessagePerReason.cs) — the switch over
  ERequestReason that runs before the save. It was the biggest remaining gap at 50.3% line / 49.4% branch,
  because every earlier fixture sent the same two shapes: reason 1 with no certificateId, and reason 3/4 with
  one. Whole arms had never been entered (EmptyCertificate, Draft, the default arm), and the helpers were only
  ever driven down their success side — CheckCertificateNumber was never given a blank or an unknown id,
  CheckCertificateUpdate never saw a mismatched agent or a type switch, ValidateCertificateInReplacement was
  never reached at all because no fixture sent certificateIdToCancel.
  Rows are saved directly at the statuses the checks care about (PR-PUB-* at Published, PR-MATCH at
  DeclarationMatch) — a certificate saved straight into a status is not a status CHANGE, so no publish side
  effects fire and the rows cost nothing but their own existence.
  WHY SIX PUBLISHED ROWS AND NOT ONE: the message endpoint takes an ILockUtil lease keyed on
  AgentRequest.CertificateId (CertificateOfOriginsBl.cs:88) whenever that id is non-empty, and the lease is
  NOT released — verified live: first call 200, second and third 400 "The certificate is locked by another
  request" for the full five minutes, even though the BL calls SafeReleaseAsync in a finally. So a certificate
  id can be transmitted exactly ONCE per five minutes, and every scenario that sends one needs its own row.
  That is a defect in its own right, recorded in reports/gap-analysis-mock-features.md — an agent retransmitting
  the same certificate hits a spurious 400.
  PURE REST (alternative 2, 2026-10-28): the one message endpoint, which answered 200 with an in-band `exceptions`
  array, is split by method - POST community/CertificateOfOrigins (reasons 1, 2, 10, 12 without a number, 201),
  PUT /{certificateId} (1, 2, 12 with a number, and 3; 200), POST /{certificateIdToCancel}/Replacement (4, 5; 201).
  The certificate number moved from the body into the URL (the lease is now keyed on the PUT URL id), a rejected
  message is 400 with the legacy code in errors[].errorCode (string), and a number that does not exist or that
  another sender created is 404 - which is why the PR-* rows are created with createCustomerId 1, the
  MessageSenderId every message here sends. The scenarios that tested a blank / missing id in the body (10, 80,
  140) and the unknown reason (70) now send their reason to an endpoint that refuses it (400 on
  AgentRequest.RequestReasonCode); see each request's comment.
variables:
  baseUrl: http://localhost:9034
scripts:
  - type: http:beforeRequest
    code: |-
      pm.request.headers.upsert({ key: 'x-mock-mode', value: 'x-mock-mode' });
      pm.request.headers.upsert({ key: 'CC-USER-ID', value: '5' });
      // Status transitions of certificates this run created: the certificate the create answered, moved to the target
      // status with its ORIGINAL status, the way the worker screen saves it.
      var TRANSITION = {
          '01-publish-A': ['00-setup-published-A', 8],
          '01-publish-B': ['00-setup-published-B', 8],
          '01-publish-C': ['00-setup-published-C', 8],
          '01-publish-D': ['00-setup-published-D', 8],
          '01-publish-E': ['00-setup-published-E', 8],
          '01-publish-G': ['00-setup-published-G', 8],
          '06-mark-match': ['05-setup-match', 6]
      };
      if (TRANSITION[pm.info.requestName]) {
          var tDto = JSON.parse(pm.collectionVariables.get('dto_' + TRANSITION[pm.info.requestName][0]) || '{}');
          tDto.originalCertificateOfOriginStatusId = tDto.certificateOfOriginStatusId;
          tDto.certificateOfOriginStatusId = TRANSITION[pm.info.requestName][1];
          pm.collectionVariables.set('transitionBody', JSON.stringify(tDto));
      }
      var iso = function (d) { return new Date(d).toISOString().slice(0, 10) + 'T00:00:00'; };
      var now = Date.now(), DAY = 86400000;
      pm.collectionVariables.set('twoDaysAgo', iso(now - 2 * DAY));
      pm.collectionVariables.set('tenDaysAgo', iso(now - 10 * DAY));

      // Every certificate id this collection transmits is minted fresh per RUN. The lock described above is not
      // released, so a constant id makes the collection un-rerunnable for five minutes - which is exactly how it
      // failed the first time it was run twice in a row. Set once per run, then reused by every request.
      if (!pm.collectionVariables.get('runId')) {
          pm.collectionVariables.set('runId', String(now).slice(-7));
      }
    language: text/javascript
  - type: http:afterResponse
    code: |-
      var name = pm.info.requestName;
      var j = null; try { j = pm.response.json(); } catch (e) { j = null; }
      // ---- certificates that reach Published / Match through the process ----
      var T_SETUP = ['00-setup-published-A', '00-setup-published-B', '00-setup-published-C', '00-setup-published-D', '00-setup-published-E', '00-setup-published-G', '05-setup-match'];
      var T_STEP = {
          '01-publish-A': ['00-setup-published-A', 8],
          '01-publish-B': ['00-setup-published-B', 8],
          '01-publish-C': ['00-setup-published-C', 8],
          '01-publish-D': ['00-setup-published-D', 8],
          '01-publish-E': ['00-setup-published-E', 8],
          '01-publish-G': ['00-setup-published-G', 8],
          '06-mark-match': ['05-setup-match', 6]
      };
      if (T_SETUP.indexOf(name) >= 0 && j) {
          pm.collectionVariables.set('dto_' + name, JSON.stringify(j));
          pm.test(name + ': created at Received (2)', function () { pm.expect(j.certificateOfOriginStatusId, 'status').to.eql(2); });
      }
      if (T_STEP[name] && j) {
          var tWant = T_STEP[name];
          pm.test(name + ': ' + tWant[0] + ' moved 2 -> ' + tWant[1], function () {
              pm.expect(j.id, 'id').to.eql(JSON.parse(pm.collectionVariables.get('dto_' + tWant[0])).id);
              pm.expect(j.certificateOfOriginStatusId, 'status').to.eql(tWant[1]);
          });
          if (tWant[1] === 8) {
              pm.test(name + ': the publish step ran (issuing date stamped)', function () {
                  pm.expect(j.issuingDate, 'issuingDate').to.be.a('string').and.not.empty;
              });
          }
      }

      pm.test('no server error (5xx)', function () {
          pm.expect(pm.response.code, 'HTTP ' + pm.response.code).to.be.below(500);
      });

      // Pure REST (alternative 2): the message is split by method - POST community/CertificateOfOrigins (create, 201),
      // PUT .../{certificateId} (update / resend, 200), POST .../{certificateIdToCancel}/Replacement (201). A rejected
      // message is 400 ProblemDetails (errors[].errorCode = the legacy exceptionType as a STRING), a number that does not
      // exist or that another sender created is 404. The worker-screen setup/publish requests (ui/...) still answer 200.
      var EXPECT_STATUS = {
          '08-setup-received': 201, '20-empty-clean': 201, '65-draft-clean': 201, '120-replace-published': 201,
          '10-empty-with-id': 400, '30-new-with-published': 400, '40-retro-with-published': 400, '50-retro-no-declaration': 400,
          '60-draft-with-published': 400, '70-unknown-reason': 400, '80-update-empty-id': 400, '100-update-agent-mismatch': 400,
          '110-update-type-switch': 400, '130-replace-not-published': 400, '140-replace-no-idtocancel': 400,
          '150-correction-blocked': 400,
          '90-update-unknown-id': 404
      };
      var want = EXPECT_STATUS[name] || 200;
      pm.test(name + ': status is ' + want, function () { pm.response.to.have.status(want); });

      // Scenarios whose legacy purpose no longer exists in pure REST (the number moved into the URL, and each endpoint
      // accepts only its own reasons). Each now sends the request reason to an endpoint that does not accept it, and is
      // refused BEFORE the message is processed: 400 on AgentRequest.RequestReasonCode, nothing created.
      //   70  - reason 99 to POST create (was: in-band RequestReasonNotExist 5020; the reason check now answers first)
      //   10  - reason 10 to PUT {id}   (was: CheckCertificateIdIsEmpty, MandatoryNullValue 2942)
      //   80  - reason 3 to POST create (was: a blank certificateId, MustSendCertificateID 14026318)
      //   140 - reason 4 to POST create (was: no certificateIdToCancel, ValueNull 6 + MustSendCertificateID 14026318)
      var REASON_REFUSED = ['70-unknown-reason', '10-empty-with-id', '80-update-empty-id', '140-replace-no-idtocancel'];
      if (REASON_REFUSED.indexOf(name) >= 0) {
          pm.test(name + ': refused on AgentRequest.RequestReasonCode', function () {
              var fields = (j && j.errors ? j.errors : []).map(function (e) { return e.field; });
              pm.expect(fields, 'errors[].field').to.include('AgentRequest.RequestReasonCode');
          });
          return;
      }

      // A certificate number that resolves to nothing is now 404 (was 200 + in-band CertificateDoesntExist 13680).
      if (name === '90-update-unknown-id') {
          return;
      }

      if (name === '08-setup-received' && j) {
          // The pure-REST result is flat: the certificate number is j.certificateId (was j.feedback.certificateId).
          var made = j.certificateId;
          if (made) { pm.collectionVariables.set('prReceived', made); }
          pm.test('08-setup: created a NOT-published certificate to replace', function () {
              pm.expect(made, 'certificateId').to.be.a('string').and.not.empty;
          });
      }

      var codes = (j && j.errors ? j.errors : []).map(function (e) { return String(e.errorCode); })
          .concat((j && j.exception ? j.exception : []).map(function (e) { return String(e.exceptionType); }));

      // Each scenario names the legacy code(s) its arm must raise - errors[].errorCode on the 400. The 400 alone does
      // not say which validator ran, so the code IS the branch proof.
      // (10-empty-with-id, 80-update-empty-id, 90-update-unknown-id and 140-replace-no-idtocancel left this list: see
      // REASON_REFUSED and the 404 above.)
      var MUST = {
          '30-new-with-published':       [14027037],        // NewCertificate -> published/cancelled (PUT)
          '40-retro-with-published':     [14027037],        // Retrospective  -> published/cancelled (PUT)
          '50-retro-no-declaration':     [4987],            // CheckExportDeclarationNumber, required
          '60-draft-with-published':     [14027037],        // Draft          -> published/cancelled (PUT)
          '100-update-agent-mismatch':   [11908, 14027037], // CheckCertificateUpdate, agent + status arms
          '110-update-type-switch':      [11909],           // CheckCertificateUpdate, type-switch arm
          '130-replace-not-published':   [4984, 4986],      // ValidateCertificateInReplacement, both arms
          '150-correction-blocked':      [14027036]         // the tail: a customs-employee task is open
      };
      // The clean sides. Asserting the ABSENCE is what makes the positive cases mean something: without these,
      // a validator that fired on everything would look just as green.
      var MUST_NOT = {
          '20-empty-clean':        [2942],
          '120-replace-published': [4984, 4986]
      };

      if (MUST[name]) {
          MUST[name].forEach(function (c) {
              pm.test(name + ': errors[] carries errorCode ' + c, function () {
                  pm.expect(codes, 'codes seen: ' + JSON.stringify(codes)).to.include(String(c));
              });
          });
      }
      if (MUST_NOT[name]) {
          pm.test(name + ': raises none of the per-reason codes', function () {
              MUST_NOT[name].forEach(function (c) {
                  pm.expect(codes, 'codes seen: ' + JSON.stringify(codes)).to.not.include(String(c));
              });
          });
      }

      // Legacy returns the rendered document for a Draft request, and for the three read/cancel reasons it returns
      // none. The migration hard-coded attachments to null everywhere, so an agent asking for a draft got no document —
      // invisible to 755 assertions because nothing had ever looked at the field. Restored 2026-09-07 (CHECK 2 blocker
      // #6); asserted here on both sides so it cannot silently regress. Pure REST returns only the uploaded document's
      // id, attachment[].externalAttachmentId (no content / fileName / documentTypeId any more).
      if (name === '65-draft-clean') {
          pm.test('65: a Draft request carries the rendered attachment', function () {
              pm.expect(j.attachment, 'attachment').to.be.an('array').that.is.not.empty;
              pm.expect(j.attachment[0].externalAttachmentId, 'externalAttachmentId').to.be.a('string').and.not.empty;
          });
      }
      if (name === '20-empty-clean') {
          // EmptyCertificate is one of the three reasons legacy explicitly excludes, so the absence here is a rule,
          // not an accident — it is what stops the positive assertion above from passing on a blanket "always attach".
          pm.test('20: EmptyCertificate carries no attachment', function () {
              pm.expect(j.attachment == null || j.attachment.length === 0, 'attachment absent').to.be.true;
          });
      }
    language: text/javascript
