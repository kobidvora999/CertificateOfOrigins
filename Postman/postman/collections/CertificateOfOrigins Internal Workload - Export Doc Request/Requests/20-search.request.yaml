$kind: http-request
url: "{{baseUrl}}/ui/ExportDocumentAuthenticationRequest/Search"
method: QUERY
headers:
  Content-Type: application/json
# Search by the invoice number the setup minted for this run: exactly the request 00 created, enriched by FillExportRequestNames (it has an exporterCustomerId). An empty filter would search the whole table - it grew past the platform row cap and answered 500.
body:
  type: json
  content: |-
    { "invoiceIdNum": "EXPINV-MULTI-{{runId}}" }
order: 12000
