$kind: http-request
url: "{{baseUrl}}/ExportDocumentAuthenticationRequest"
method: POST
headers:
  Content-Type: application/json
# Same stale-rowversion conflict, but on a payload WITH child collections so the conflict is raised during
# the child merge rather than on the parent row. That path returned 500 until the DAL stopped calling
# Context.SaveChangesAsync itself; now the BL commits it and BaseBL maps it to 409 like any other conflict.
body:
  type: json
  content: |-
    {
      "id": {{conflictId}}, "timeStamp": "AAAAAAAAAAA=",
      "state": 1, "organizationUnitId": 1, "statusId": 2, "originalStatusId": 2,
      "title": "concurrency setup", "customerId": 777, "exporterCustomerId": 888,
      "typeId": 1, "countryId": 32, "authenticationRequestNotes": "stale write with children",
      "listOfAdditionalDocumentsIds": [],
      "customsItems": [ { "id": 0, "exportDocumentAuthenticationRequestId": 0, "customsItemId": 5001 } ],
      "leadDocuments": [ { "id": 0, "exportRequestId": 0, "leadDocumentId": 6001, "leadDocumentTitle": "Lead doc A" } ],
      "manufacturingAreas": [],
      "authenticationDocumentTypeId": 1
    }
order: 30200
