$kind: http-request
url: "{{baseUrl}}/ui/AuthenticationRequest/SaveImport"
method: POST
headers:
  Content-Type: application/json
# An UPDATE (isNewInstance = false) of a request that does not exist -> 404, never an insert. A complete body: without the dates the UPDATE fails first with a 500 (see report).
body:
  type: json
  content: |-
    {
      "documentId": 2147483647,
      "isNewInstance": false,
      "decisionId": 1,
      "authenticationRequestDate": "{{today}}",
      "documentIssuingDate": "{{today}}",
      "importCountryId": 32,
      "issuingCountryId": 32,
      "originCountryId": 32,
      "number": 1,
      "preferenceDocumentTypeId": 1,
      "organizationUnitId": 1,
      "userId": 5,
      "userResponseId": 5,
      "isCurrentUserHandleRequest": true,
      "collaterals": []
    }
order: 5200
