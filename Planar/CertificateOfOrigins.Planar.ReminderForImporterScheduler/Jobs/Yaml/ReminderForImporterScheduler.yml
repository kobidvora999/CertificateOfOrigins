# Planar job definition — deployed to the Planar server, not loaded by the console project itself.
# Legacy equivalent: the BaseScheduleTask ReminderForImporterScheduler entry in the WCF service's task schedule.
name: CertificateOfOrigins.ReminderForImporterScheduler
group: CertificateOfOrigins
description: Opens a send-reminder-to-importer task for import authentication requests unanswered past the reminder window.
author: CertificateOfOrigins migration
jobType: Process
durable: true
properties:
  path: CertificateOfOrigins.Planar.ReminderForImporterScheduler
  filename: CertificateOfOrigins.Planar.ReminderForImporterScheduler.exe

# Once daily. TODO(confirm): the legacy schedule lives in the WCF task table, not in source — confirm the intended
# time with the business owner before enabling in a real environment.
triggers:
  - type: cron
    name: daily
    cronExpression: 0 0 5 ? * *
